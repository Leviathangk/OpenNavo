# CI only: build the E2E images from layers kept in the GitHub Actions cache, so
# the MinIO source build (about 2.5 minutes) and the helper images are reused
# across runs. ops/e2e.py adds this file when OPENNAVO_E2E_BUILD_CACHE is gha or
# gha-save; docker-compose.e2e.ci-save.yml also writes the layers, on main only,
# so pull requests never fill the repository cache. Local runs never read either.
services:
  postgres:
    build:
      cache_from:
        - type=gha,scope=e2e-postgres
  redis:
    build:
      cache_from:
        - type=gha,scope=e2e-redis
  minio:
    build:
      cache_from:
        - type=gha,scope=e2e-minio
