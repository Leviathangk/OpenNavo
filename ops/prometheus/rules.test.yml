rule_files: [rules.yml]
evaluation_interval: 1m
tests:
  - name: backlog, latency and service alerts fire
    interval: 1m
    input_series:
      - series: asynq_queue_latency_seconds{queue="default"}
        values: '301+0x90'
      - series: opennavo_queue_metrics_collection_success
        values: '1+0x90'
      - series: catalog_last_success_timestamp_seconds
        values: '0+0x90'
      - series: asynq_queue_size{queue="default",state="pending"}
        values: '10001+0x90'
      - series: http_requests_total{status="500",route="/api/v1/home",method="GET"}
        values: '0+2x90'
      - series: http_requests_total{status="200",route="/api/v1/home",method="GET"}
        values: '0+98x90'
      - series: github_ratelimit_remaining
        values: '499+0x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: QueueLatency
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Oldest pending task has waited over five minutes'}
      - eval_time: 70m
        alertname: CatalogSyncStale
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: 'Catalog synchronization has not succeeded for over an hour'}
      - eval_time: 70m
        alertname: QueueBacklog
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Pending and retry task backlog exceeds ten thousand'}
      - eval_time: 70m
        alertname: APIErrorRate
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: 'API server error rate exceeds one percent'}
      - eval_time: 70m
        alertname: GitHubQuotaLow
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'GitHub remaining quota is below five hundred'}
  - name: thresholds and unknown quota do not fire
    interval: 1m
    input_series:
      - series: catalog_last_success_timestamp_seconds
        values: '0+60x90'
      - series: asynq_queue_size{queue="default",state="pending"}
        values: '10000+0x90'
      - series: http_requests_total{status="500"}
        values: '0+1x90'
      - series: http_requests_total{status="200"}
        values: '0+99x90'
      - series: asynq_queue_size{queue="default",state="scheduled"}
        values: '20000+0x90'
      - series: asynq_queue_size{queue="default",state="archived"}
        values: '20000+0x90'
      - series: asynq_queue_size{queue="default",state="pending",instance="second-api"}
        values: '10000+0x90'
      - series: asynq_queue_latency_seconds{queue="default"}
        values: '300+0x90'
      - series: github_ratelimit_remaining
        values: '-1+0x90'
    alert_rule_test:
      - {eval_time: 70m, alertname: CatalogSyncStale, exp_alerts: []}
      - {eval_time: 70m, alertname: QueueBacklog, exp_alerts: []}
      - {eval_time: 70m, alertname: QueueLatency, exp_alerts: []}
      - {eval_time: 70m, alertname: APIErrorRate, exp_alerts: []}
      - {eval_time: 70m, alertname: GitHubQuotaLow, exp_alerts: []}
  - name: business Redis pressure and OOM are actionable; cache eviction is not an outage
    interval: 1m
    input_series:
      - series: opennavo_redis_used_memory_bytes{role="business"}
        values: '90+0x20'
      - series: opennavo_redis_maxmemory_bytes{role="business"}
        values: '100+0x20'
      - series: opennavo_redis_oom_errors_total{role="business"}
        values: '0+1x20'
      - series: opennavo_redis_up{role="business"}
        values: '1+0x20'
      - series: opennavo_redis_used_memory_bytes{role="cache"}
        values: '99+0x20'
      - series: opennavo_redis_maxmemory_bytes{role="cache"}
        values: '100+0x20'
      - series: opennavo_redis_evicted_keys_total{role="cache"}
        values: '0+100x20'
      - series: opennavo_redis_up{role="cache"}
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: BusinessRedisMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, role: business}
            exp_annotations: {summary: 'Business Redis memory exceeds 70 percent of its limit'}
      - eval_time: 10m
        alertname: BusinessRedisMemoryCritical
        exp_alerts:
          - exp_labels: {severity: critical, role: business}
            exp_annotations: {summary: 'Business Redis memory exceeds 85 percent of its limit'}
      - eval_time: 10m
        alertname: RedisOOM
        exp_alerts:
          - exp_labels: {severity: critical, role: business}
            exp_annotations: {summary: 'Redis is rejecting writes because its memory limit was reached'}
      - eval_time: 10m
        alertname: RedisUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, role: cache}
            exp_annotations: {summary: 'Redis metrics probes cannot reach the instance'}
  - name: queue inspection failure remains observable
    interval: 1m
    input_series:
      - series: opennavo_queue_metrics_collection_success
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: QueueMetricsUnavailable
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Asynq queue metrics could not be collected'}
      - {eval_time: 5m, alertname: QueueBacklog, exp_alerts: []}
