name: opennavo-prod
x-backend-env: &backend-env
  APP_ENV: prod
  HTTP_ADDR: ':8080'
  METRICS_ADDR: ':9090'
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Configure PUBLIC_BASE_URL}
  WEB_BASE_URL: ${WEB_BASE_URL:?Configure WEB_BASE_URL}
  ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Configure ADMIN_ORIGIN}
  PUBLIC_CORS_ORIGINS: ${PUBLIC_CORS_ORIGINS:-}
  DATABASE_URL: ${DATABASE_URL:?Configure application DATABASE_URL}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-30}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT: ${S3_ENDPOINT:?Configure S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-opennavo}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
  S3_USE_SSL: ${S3_USE_SSL:-true}
  CDN_BASE_URL: ${CDN_BASE_URL:?Configure CDN_BASE_URL}
  JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
  CI_RELEASE_TOKEN: ${CI_RELEASE_TOKEN:?Configure CI_RELEASE_TOKEN}
  GITHUB_SETTINGS_ENCRYPTION_KEY: ${GITHUB_SETTINGS_ENCRYPTION_KEY:-}
  SEO_SETTINGS_ENCRYPTION_KEY: ${SEO_SETTINGS_ENCRYPTION_KEY:-}
  # URL change feed: the worker refreshes web page caches through the web's internal port.
  WEB_INTERNAL_URL: http://web:9091
  WEB_INTERNAL_SECRET: ${WEB_INTERNAL_SECRET:-}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: gpt-6-luna
  LLM_REASONING_EFFORT: high
  LLM_CONCURRENCY: ${LLM_CONCURRENCY:-8}
  LLM_RPM: ${LLM_RPM:-120}
  LLM_TIMEOUT: 5m
  LLM_MONTHLY_TOKEN_BUDGET: ${LLM_MONTHLY_TOKEN_BUDGET:-30000000}
  LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-0}
  HOMEBREW_API_BASE: ${HOMEBREW_API_BASE:-https://formulae.brew.sh/api}
  TZ_SCHEDULE: Asia/Shanghai
  LOG_LEVEL: info
  ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
x-server: &server
  image: ${SERVER_IMAGE:?Build or pull SERVER_IMAGE}
  restart: unless-stopped
  environment: *backend-env
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
  security_opt: ['no-new-privileges:true']
  depends_on:
    redis: {condition: service_healthy}
    postgres: {condition: service_healthy, required: false}
services:
  api:
    <<: *server
    environment:
      <<: *backend-env
      CACHE_REDIS_URL: redis://web-cache:6379/1
      AGENT_GATEWAY_SECRET: ${AGENT_GATEWAY_SECRET:?Configure shared API/MCP gateway secret}
      TRUSTED_PROXIES: ${CADDY_PROXY_IP:-172.30.80.2},${SSR_PROXY_SUBNET:-172.30.81.0/24}
      # Collect garbage before the container limit; image uploads otherwise ended in OOM kills.
      GOMEMLIMIT: 900MiB
    networks:
      default:
      proxy:
        aliases: [api-proxy]
      ssr:
        aliases: [api-ssr]
      agent:
        aliases: [api-agent]
    deploy:
      replicas: 2
      resources:
        limits: {memory: 1G}
    healthcheck:
      test: ['CMD', '/probe', 'api']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
  mcp:
    image: ${MCP_IMAGE:?Build or pull MCP_IMAGE}
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      OPENNAVO_AGENT_API_BASE: http://api-agent:8080/agent-api
      AGENT_GATEWAY_SECRET: ${AGENT_GATEWAY_SECRET:?Configure shared API/MCP gateway secret}
      OPENNAVO_MCP_HOST: 0.0.0.0
      OPENNAVO_MCP_PORT: '8790'
      OPENNAVO_MCP_PATH: /mcp
      OPENNAVO_MCP_TRUSTED_PROXIES: '["${CADDY_PROXY_IP:-172.30.80.2}/32"]'
    networks:
      agent:
      proxy:
        aliases: [mcp-proxy]
    deploy:
      resources:
        limits: {memory: 512M}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-I', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
  worker:
    <<: *server
    entrypoint: ['/worker']
    deploy:
      resources:
        # One core at most: periodic catalog syncs must not starve the API and database.
        limits: {memory: 1G, cpus: '1.0'}
    healthcheck:
      test: ['CMD', '/probe', 'worker']
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 60s
      start_interval: 2s
  web:
    networks:
      default:
      proxy:
        aliases: [web-proxy]
      ssr:
    image: ${WEB_IMAGE:?Build or pull frontend WEB_IMAGE}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      NUXT_API_BASE_INTERNAL: http://api-ssr:8080/api/v1
      NUXT_TRUSTED_PROXIES: ${CADDY_PROXY_IP:-172.30.80.2}
      NUXT_PUBLIC_API_BASE: ${PUBLIC_BASE_URL}/api/v1
      NUXT_PUBLIC_SITE_URL: ${WEB_BASE_URL}
      NUXT_PUBLIC_I18N_BASE_URL: ${WEB_BASE_URL}
      NUXT_PUBLIC_CDN_BASE: ${CDN_BASE_URL}
      # Where share images read icons inside the Docker network; empty fetches them from the CDN.
      NUXT_CDN_BASE_INTERNAL: ${CDN_BASE_URL_INTERNAL:-}
      NUXT_REDIS_URL: redis://web-cache:6379/0
      NUXT_OG_IMAGE_SECRET: ${NUXT_OG_IMAGE_SECRET:?Set a stable OG image signing secret}
      # Internal port: crawler counters for Prometheus and page-cache invalidation for the worker.
      NUXT_METRICS_PORT: '9091'
      NUXT_INTERNAL_SECRET: ${WEB_INTERNAL_SECRET:-}
    deploy:
      replicas: 2
      resources:
        limits: {memory: 512M}
    depends_on:
      api: {condition: service_healthy}
      web-cache: {condition: service_healthy}
  web-cache:
    # Disposable page cache must not share memory with sessions, rate limits, or Asynq queues.
    image: ${REDIS_IMAGE:-opennavo-redis:local}
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '768mb', '--maxmemory-policy', 'allkeys-lru']
    deploy:
      resources:
        limits: {memory: 1G}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
  caddy:
    image: ${CADDY_IMAGE:-opennavo-caddy:local}
    restart: unless-stopped
    networks:
      default:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.80.2}
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Configure WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Configure API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Configure ADMIN_DOMAIN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ADMIN_DIST:?Provide the built admin directory}:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
      mcp: {condition: service_healthy}
  redis:
    image: ${REDIS_IMAGE:-opennavo-redis:local}
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '1024mb', '--maxmemory-policy', 'noeviction']
    restart: unless-stopped
    volumes: [redis-data:/data]
    deploy:
      resources:
        limits: {memory: 1536M}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
  postgres:
    image: ${POSTGRES_IMAGE:-opennavo-postgres:local}
    profiles: [local-db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: opennavo
      POSTGRES_USER: opennavo_migrate
      POSTGRES_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Configure migration database password}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opennavo_migrate -d opennavo']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
  migrate:
    <<: *server
    profiles: [ops]
    restart: 'no'
    entrypoint: ['/migrate']
    command: ['up']
    environment:
      <<: *backend-env
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Configure separate migration DATABASE_URL}
  db-permissions:
    <<: *server
    profiles: [ops]
    restart: 'no'
    entrypoint: ['/db-bootstrap']
    environment:
      <<: *backend-env
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Configure application database password}
  seed:
    <<: *server
    profiles: [ops]
    restart: 'no'
    entrypoint: ['/seed']
  storage-init:
    <<: *server
    profiles: [ops]
    restart: 'no'
    entrypoint: ['/storage-init']
  backup:
    image: ${OPS_IMAGE:?Build or pull the PostgreSQL backup helper image}
    profiles: [backup]
    restart: unless-stopped
    command: ['daemon']
    environment:
      <<: *backend-env
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy, required: false}
  asynqmon:
    image: ${ASYNQMON_IMAGE:-opennavo-asynqmon:local}
    profiles: [monitoring]
    command: ['--redis-addr=redis:6379', '--enable-metrics-exporter', '--read-only']
    ports: ['127.0.0.1:${ASYNQMON_PORT:-19881}:8080']
    depends_on:
      redis: {condition: service_healthy}
  prometheus:
    image: registry.hub.docker.com/prom/prometheus:v3.15.0
    profiles: [monitoring]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-19091}:9090']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on: [api, asynqmon]
  grafana:
    image: registry.hub.docker.com/grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configure Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    ports: ['127.0.0.1:${GRAFANA_PORT:-19092}:3000']
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
networks:
  agent:
    internal: true
  ssr:
    internal: true
    ipam:
      config:
        - subnet: ${SSR_PROXY_SUBNET:-172.30.81.0/24}
  proxy:
    ipam:
      config:
        - subnet: ${CADDY_PROXY_SUBNET:-172.30.80.0/24}
          # Allocate dynamic containers only from the upper half, reserving space for Caddy's fixed address.
          ip_range: ${CADDY_PROXY_IP_RANGE:-172.30.80.128/25}
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
