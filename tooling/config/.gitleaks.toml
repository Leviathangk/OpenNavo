title = "OpenNavo secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Match both path and line shape; never exempt a whole source file.
[[rules.allowlists]]
description = "SHA-256 translation source hashes"
condition = "AND"
paths = ['''^(tooling/i18n/)?i18n\.lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"\r\n]+": "[a-f0-9]{64}",?\s*$''']

[[rules.allowlists]]
description = "Generated OpenAPI compressed schema chunks"
condition = "AND"
paths = ['''^(apps/)?server/gen/(publicapi/publicapi|adminapi/adminapi)\.gen\.go$''']
regexTarget = "line"
regexes = ['''^(\s*"[A-Za-z0-9+/=]{80}",?\s*)+$''']

[[rules]]
id = "sourcegraph-access-token"

# Native dependency versions are public Git SHA-1 revisions, not access tokens.
[[rules.allowlists]]
description = "Third-party source revisions in generated About seed data"
condition = "AND"
paths = ['''^apps/server/seeds/about\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"version": "[a-f0-9]{40}",?\s*$''',
  '''^\s*"url": "https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/tree/[a-f0-9]{40}",?\s*$''',
]
