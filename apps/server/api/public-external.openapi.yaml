# Derived from apps/server/api/public.openapi.yaml; only stable anonymous read operations are published.
---
openapi: 3.0.3
info:
  title: OpenNavo Public Read API
  version: 1.0.0
  termsOfService: https://opennavo.com/developers#terms
  description: |-
    Stable, anonymous, read-only catalog endpoints for OpenNavo.

    Responses use the `{code, msg, data}` envelope and return `code = "0000"` on success. Fields use camelCase; timestamps use RFC 3339 (UTC). Localization prefers the `locale` query parameter, then `Accept-Language`, and defaults to `en-US`.

    Rate limits are enforced per client IP by a Redis-backed GCRA limiter. Ordinary read endpoints allow 300 requests per 60 seconds; `/search` allows 60 requests per 60 seconds. Responses include `X-RateLimit-Limit` and `X-RateLimit-Remaining`. A rejected request returns HTTP 429 with `Retry-After` in seconds. Limits are shared across API instances and may change with fair-use policy.

    The public surface contains catalog reads only; telemetry and write-oriented routes are outside this document.
servers:
- url: https://api.opennavo.com/api/v1
- url: http://localhost:8080/api/v1
security: []
tags:
- name: catalog
  description: Public app catalog, categories and dependencies
- name: search
  description: Public app search
- name: releases
  description: Public release history
- name: rankings
  description: Public installation rankings
- name: collections
  description: Public app collections
- name: articles
  description: Published public articles
paths:
  "/categories":
    get:
      tags:
      - catalog
      operationId: listCategories
      summary: Category tree with package counts
      parameters:
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CategoryTreeResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/packages/{kind}/{token}":
    get:
      tags:
      - catalog
      operationId: getPackage
      summary: Package details
      parameters:
      - "$ref": "#/components/parameters/KindPath"
      - "$ref": "#/components/parameters/TokenPath"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PackageDetailResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        '404':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/packages/{kind}/{token}/releases":
    get:
      tags:
      - releases
      operationId: listPackageReleases
      summary: Release history timeline
      description: Merge Homebrew versions and release notes, preferring editorial notes with historical notes as fallback (no new upstream fetching or summary generation), sorted by version descending.
      parameters:
      - "$ref": "#/components/parameters/KindPath"
      - "$ref": "#/components/parameters/TokenPath"
      - name: original
        in: query
        description: When true, prefer English release notes and fall back to the source language if English is missing; the UI still labels these as Original
        schema:
          type: boolean
          default: false
      - name: onlyWithNotes
        in: query
        description: Return only versions with release notes
        schema:
          type: boolean
          default: false
      - "$ref": "#/components/parameters/Current"
      - "$ref": "#/components/parameters/SizeTwenty"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReleasePageResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        '404':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/packages/{kind}/{token}/dependencies":
    get:
      tags:
      - catalog
      operationId: getPackageDependencies
      summary: Dependencies and conflicts
      parameters:
      - "$ref": "#/components/parameters/KindPath"
      - "$ref": "#/components/parameters/TokenPath"
      - name: platform
        in: query
        description: macOS label from supported_platforms. When provided, resolve the dependency tree and conflicts for that platform; unsupported labels return 400.
        schema:
          type: string
          maxLength: 80
          pattern: "^(arm64_)?[a-z][a-z0-9_]*$"
      - name: depth
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 3
          default: 2
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DependenciesResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        '404':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/packages/{kind}/{token}/related":
    get:
      tags:
      - catalog
      operationId: listRelatedPackages
      summary: Similar packages with the same content type and primary category
      parameters:
      - "$ref": "#/components/parameters/KindPath"
      - "$ref": "#/components/parameters/TokenPath"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 12
          default: 8
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PackageSummaryListResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/articles":
    get:
      tags:
      - articles
      operationId: listArticles
      summary: Published articles
      description: Newest first. Each card uses the requested language when its translation is ready and not held back, otherwise the source language (locale tells which). Withdrawn articles are never listed.
      parameters:
      - "$ref": "#/components/parameters/Locale"
      - "$ref": "#/components/parameters/Current"
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
      - name: type
        in: query
        schema:
          "$ref": "#/components/schemas/ArticleType"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArticlePageResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/articles/{slug}":
    get:
      tags:
      - articles
      operationId: getArticle
      summary: One article
      description: 'published: the published revision, in the requested language when its translation is ready and not held back (availableLocales lists those languages; others show the source text and should not be indexed). moved: a former slug; the API answers 200 with state moved and slug set to the current slug, and a website should redirect permanently to it. withdrawn: taken off the site; the API answers 200 with state withdrawn and no article, and a website should answer 410 Gone. Unknown slugs return 404. Drafts are never readable here.'
      parameters:
      - "$ref": "#/components/parameters/ArticleSlugPath"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArticleLookupResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/search":
    get:
      tags:
      - search
      operationId: searchPackages
      summary: Search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - "$ref": "#/components/parameters/KindQuery"
      - name: category
        in: query
        schema:
          type: string
      - name: includeDisabled
        in: query
        schema:
          type: boolean
          default: false
      - name: platform
        in: query
        schema:
          type: string
          enum:
          - web
          - desktop
          default: web
      - "$ref": "#/components/parameters/Current"
      - "$ref": "#/components/parameters/Size"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 60
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/rankings":
    get:
      tags:
      - rankings
      operationId: listRankings
      summary: Installation rankings
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          "$ref": "#/components/schemas/PackageKind"
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 30d
          - 90d
          - 365d
          default: 30d
      - name: category
        in: query
        schema:
          type: string
      - name: includeFonts
        in: query
        schema:
          type: boolean
          default: true
      - "$ref": "#/components/parameters/Current"
      - "$ref": "#/components/parameters/Size"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RankingPageResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/collections":
    get:
      tags:
      - collections
      operationId: listCollections
      summary: Published collections
      parameters:
      - "$ref": "#/components/parameters/Current"
      - "$ref": "#/components/parameters/SizeTwenty"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CollectionSummaryPageResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/collections/{slug}":
    get:
      tags:
      - collections
      operationId: getCollection
      summary: Collection details
      parameters:
      - "$ref": "#/components/parameters/SlugPath"
      - "$ref": "#/components/parameters/Locale"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CollectionDetailResponse"
          headers:
            Vary:
              description: Includes at least Origin and Accept-Language; preserves existing Vary values.
              schema:
                type: string
        '404':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
  "/collections/{slug}/brewfile":
    get:
      tags:
      - collections
      operationId: getCollectionBrewfile
      summary: Export a collection as a plain-text Brewfile
      parameters:
      - "$ref": "#/components/parameters/SlugPath"
      responses:
        '200':
          description: Brewfile text
          content:
            text/plain:
              schema:
                type: string
        '404':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
        '429':
          description: The per-IP rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until another request may be attempted.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests allowed in the current 60-second window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining before the limit is reached.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-rate-limit:
        algorithm: GCRA
        scope: per-ip
        requests: 300
        window: 60s
        headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
components:
  parameters:
    Locale:
      name: locale
      in: query
      schema:
        "$ref": "#/components/schemas/Locale"
      description: locale > Accept-Language (the ten site languages, matched by q value) > en-US. Missing translations fall back to en-US, then the source language.
    KindPath:
      name: kind
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/PackageKind"
    TokenPath:
      name: token
      in: path
      required: true
      description: Homebrew token; may contain `@`, for example `python@3.14`
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9@._+-]*$"
        maxLength: 128
    Current:
      name: current
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    SizeTwenty:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ArticleSlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 100
    KindQuery:
      name: kind
      in: query
      schema:
        "$ref": "#/components/schemas/PackageKind"
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
        maxLength: 64
  schemas:
    CategoryTreeResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/CategoryNode"
    ErrorResponse:
      type: object
      required:
      - code
      - msg
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          type: object
          nullable: true
    PackageDetailResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          "$ref": "#/components/schemas/PackageDetail"
    ReleasePageResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          "$ref": "#/components/schemas/ReleasePage"
    DependenciesResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          "$ref": "#/components/schemas/Dependencies"
    PackageSummaryListResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          type: array
          items:
            "$ref": "#/components/schemas/PackageSummary"
    ArticleType:
      type: string
      enum:
      - recommendation
      - review
      - tutorial
      - roundup
      - news
    ArticlePageResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
          "$ref": "#/components/schemas/ArticlePage"
    ArticleLookupResponse:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          "$ref": "#/components/schemas/Code"
        msg:
          type: string
        data:
