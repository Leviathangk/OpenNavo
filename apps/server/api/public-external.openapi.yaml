    AppPrice:
      type: object
      required:
      - type
      - amount
      - currency
      - region
      - plan
      - period
      - appVersion
      - sourceUrl
      - method
      - verifiedAt
      - stale
      - offer
      description: Verified price type with its evidence (WP12). Absent when unknown or marked for review; a free download never implies free.
      properties:
        type:
          type: string
          enum:
          - free
          - free_with_iap
          - paid
          - subscription
          - trial
        amount:
          type: number
          format: double
          nullable: true
        currency:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
          description: ISO 3166-1 country the price was checked for
        plan:
          type: string
          nullable: true
          description: Vendor plan name as the vendor writes it; not translated
        period:
          type: string
          nullable: true
          enum:
          - one_time
          - month
          - year
        appVersion:
          type: string
          nullable: true
        sourceUrl:
          type: string
        method:
          type: string
          enum:
          - vendor_site
          - app_store
          - vendor_docs
          - in_app
          - other
        verifiedAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: 'Verified more than 365 days ago: show the date as possibly outdated'
        offer:
          type: boolean
          description: 'Structured data may publish an offer: current, and free to obtain (price 0) or a complete amount with currency, region and plan'
    MacosSupplement:
      type: object
      required:
      - ranges
      - appVersion
      - sourceUrl
      - method
      - verifiedAt
      - stale
      - conflicts
      description: Vendor-sourced macOS support kept beside Homebrew's requirements, never replacing them. With conflicts, show both as pending verification.
      properties:
        ranges:
          type: array
          items:
            "$ref": "#/components/schemas/MacosRange"
        appVersion:
          type: string
          nullable: true
        sourceUrl:
          type: string
        method:
          type: string
          enum:
          - vendor_site
          - app_store
          - vendor_docs
          - in_app
          - other
        verifiedAt:
          type: string
          format: date-time
        stale:
          type: boolean
        conflicts:
          type: array
          description: Where the supplement and Homebrew disagree
          items:
            type: string
            enum:
            - minimum
            - maximum
            - arm64
            - x86_64
    PackageAlternative:
      type: object
      required:
      - package
      - reasons
      - limits
      - bestFor
