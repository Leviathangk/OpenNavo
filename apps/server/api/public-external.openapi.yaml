      properties:
        attributes:
          type: array
          items:
            "$ref": "#/components/schemas/ComparisonAttributeFact"
        prices:
          type: array
          items:
            "$ref": "#/components/schemas/PriceFact"
        migration:
          "$ref": "#/components/schemas/MigrationGuide"
        package:
          "$ref": "#/components/schemas/PackageSummary"
        reasons:
          type: array
          description: Why someone would pick it; translate the codes
          items:
            type: string
            enum:
            - free
            - open_source
            - lighter
            - more_features
            - simpler
            - native_ui
            - apple_silicon
            - privacy
            - offline
            - collaboration
            - cross_platform
            - one_time_purchase
            - active_development
            - customizable
        limits:
          type: array
          description: What to weigh before switching; translate the codes
          items:
            type: string
            enum:
            - paid
            - subscription
            - fewer_features
            - requires_account
            - learning_curve
            - different_workflow
            - no_apple_silicon
            - online_only
            - limited_languages
        bestFor:
          type: string
          nullable: true
          enum:
          - everyday
          - professionals
          - developers
          - teams
          - beginners
          - power_users
    ArticleCard:
      type: object
      required:
      - slug
      - type
      - title
