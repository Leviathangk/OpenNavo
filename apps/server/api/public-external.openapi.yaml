      properties:
        state:
          type: string
          enum:
          - active
          - deprecated
          - disabled
          x-enum-varnames:
          - HomebrewActive
          - HomebrewDeprecated
          - HomebrewDisabled
        reason:
          type: string
          nullable: true
        date:
          type: string
          format: date
          nullable: true
    OpenSourceFact:
      type: object
      required:
