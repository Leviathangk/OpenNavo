            method:
              type: string
              enum:
              - homebrew
              - uv
              - npm
            package:
              type: string
              minLength: 1
              maxLength: 200
              description: Package identifier only. Commands, arguments, URLs and version selectors are not accepted.
          additionalProperties: false
        clients:
          type: array
          items:
            type: string
            enum:
            - claude_desktop
            - cursor
            - codex
          minItems: 1
          maxItems: 3
          uniqueItems: true
        permissions:
          type: object
          required:
          - files
          - network
          properties:
            files:
              type: array
              items:
                type: object
                required:
                - path
                - access
                properties:
                  path:
                    type: string
                    minLength: 1
                    maxLength: 1024
                  access:
                    type: string
                    enum:
                    - read
                    - write
                    - read_write
                additionalProperties: false
              maxItems: 30
            network:
              type: array
              items:
                type: string
                format: uri
                description: HTTPS origin only.
              maxItems: 30
          additionalProperties: false
        appleSilicon:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        versions:
          type: array
          items:
            type: object
            required:
            - version
            - releasedAt
            - sourceUrl
            properties:
              version:
                type: string
                minLength: 1
                maxLength: 100
              releasedAt:
                type: string
                format: date-time
              sourceUrl:
                type: string
                format: uri
            additionalProperties: false
          minItems: 1
          maxItems: 30
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
      additionalProperties: false
    MacosRange:
      type: object
      required:
      - arch
      - support
      - minimum
      - maximum
      properties:
        arch:
          type: string
          enum:
          - arm64
          - x86_64
        support:
          type: string
          description: native, rosetta (arm64 only) or unsupported, as the vendor states it
          enum:
          - native
          - rosetta
          - unsupported
        minimum:
          type: string
          nullable: true
        maximum:
          type: string
          nullable: true
    ComparisonAttributeFact:
      type: object
      required:
      - name
      - evidence
      properties:
        name:
          type: string
          enum:
          - open_source
          - offline
          - apple_silicon
          - import_formats
          - export_formats
        appVersion:
          type: string
        booleanValue:
          type: boolean
        formats:
          type: array
          items:
            type: string
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
      additionalProperties: false
    MigrationGuide:
      type: object
      required:
      - targetPackageId
      - locale
      - steps
      - evidence
      properties:
        targetPackageId:
          type: integer
          format: int64
          minimum: 1
        locale:
          type: string
          enum:
          - en-US
          - zh-CN
          - ja-JP
          - es-ES
          - pt-BR
          - ru-RU
          - de-DE
          - fr-FR
          - it-IT
          - zh-Hant
        sourceVersion:
          type: string
        targetVersion:
          type: string
        steps:
          type: array
          items:
            "$ref": "#/components/schemas/MigrationStep"
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
      additionalProperties: false
    ArticleCover:
      type: object
      required:
      - url
      - width
      - height
      - alt
      properties:
        url:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        alt:
          type: string
          description: Ready requested-language alt, falling back to ready English then revision source alt.
    ArticleAuthorRef:
      type: object
      required:
      - slug
      - name
      properties:
        slug:
          type: string
        name:
          type: string
    GithubRelease:
      type: object
      additionalProperties: false
      required:
      - tag
      - version
      - publishedAt
      - url
      - assets
      properties:
        tag:
          type: string
        version:
          type: string
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        assets:
          type: array
          items:
            "$ref": "#/components/schemas/ReleaseAsset"
      nullable: true
    ArticleAuthor:
      type: object
      required:
      - slug
      - name
      - role
      - bio
      - avatarUrl
      - links
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        links:
          type: array
          items:
            "$ref": "#/components/schemas/ArticleSource"
    ArticleSource:
      type: object
      required:
      - title
      - url
      properties:
        title:
          type: string
        url:
          type: string
    ArticleImage:
      type: object
      required:
      - url
      - width
      - height
      properties:
        url:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
    CollectionCriteria:
      type: object
      required:
      - locale
      - criteria
      - evidence
      properties:
        locale:
          type: string
          enum:
          - en-US
          - zh-CN
          - ja-JP
          - es-ES
          - pt-BR
          - ru-RU
          - de-DE
          - fr-FR
          - it-IT
          - zh-Hant
        criteria:
          type: string
          minLength: 1
          maxLength: 10000
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
    CollectionExternalApp:
      type: object
      required:
      - token
      - url
      properties:
        token:
          type: string
        url:
          type: string
          format: uri
    CollectionPriceTotal:
      type: object
      required:
      - region
      - currency
      - period
      - amount
      - coveredApps
      properties:
        region:
          type: string
        currency:
          type: string
        period:
          type: string
        amount:
          type: string
        coveredApps:
          type: integer
    CollectionCompatibility:
      type: object
      required:
      - token
      - requirements
      properties:
        token:
          type: string
        requirements:
          type: array
          items:
            "$ref": "#/components/schemas/RequirementFact"
    SecurityIdentityFact:
      type: object
      required:
      - channels
      - openSource
      - evidence
      properties:
        appVersion:
          type: string
        developer:
          type: string
          maxLength: 160
        teamId:
          type: string
          pattern: "^[A-Z0-9]{10}$"
        channels:
          type: array
          items:
            type: string
            enum:
            - homebrew
            - vendor
            - app_store
        openSource:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        repositoryUrl:
          type: string
          format: uri
        productCpe:
          type: string
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
      additionalProperties: false
    VulnerabilityFact:
      type: object
      required:
      - id
      - productCpe
      - appVersion
      - sourceUrl
      - evidence
      properties:
        id:
          type: string
          pattern: "^CVE-[0-9]{4}-[0-9]{4,}$"
        productCpe:
          type: string
        appVersion:
          type: string
        sourceUrl:
          type: string
          format: uri
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
    FactEvidence:
      type: object
      required:
      - sourceUrl
      - checkedAt
      - validUntil
      - status
      properties:
        sourceUrl:
          type: string
        checkedAt:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - verified
          - stale
          - needs_review
          - unknown
    MigrationStep:
      type: object
      required:
      - action
      - text
      - evidence
      properties:
        action:
          type: string
          enum:
          - backup
          - export
          - import
          - verify
        text:
          type: string
          minLength: 1
          maxLength: 4000
        evidence:
          "$ref": "#/components/schemas/FactEvidence"
      additionalProperties: false
    ReleaseAsset:
      type: object
      additionalProperties: false
      required:
      - name
      - url
      - size
      - arch
      - format
      - sha256
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        size:
          type: integer
          format: int64
          minimum: 0
        arch:
          type: string
          nullable: true
          enum:
          - arm64
          - x86_64
          - universal
          -
        format:
          type: string
          enum:
          - dmg
          - zip
          - pkg
          - other
        sha256:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{64}$"
  responses:
    Error:
      description: Error response. code is a stable numeric OpenNavo error code, msg a localized message, and data is null.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
externalDocs:
  description: OpenNavo developer documentation
  url: https://opennavo.com/developers
