    ReleaseEntry:
      type: object
      description: 'Editorial notes are shown only in the requested locale: source text for the source locale, otherwise manual/machine text matching the current source hash. Unavailable editorial translations fall back to original upstream notes for the same version using source priority; without upstream notes, hasNotes is false and translation reports pending/failed/skipped. Editorial notes that only say the changes are not known count as unavailable in every locale: they fall back the same way, and without upstream notes the entry keeps its id, source, dates and sourceUrl with hasNotes false, no title, summary, body or sections, and translation none. The selected note supplies id/source/sourceLocale. Version and build grouping are preserved.'
      required:
      - version
      - source
      - isLatest
      - isPrerelease
      - hasNotes
      - sections
      - translation
      properties:
        compatibility:
          "$ref": "#/components/schemas/VersionCompatibility"
        id:
          type: integer
          format: int64
          nullable: true
          description: releases.id; null for entries derived only from Homebrew version records
        version:
          type: string
          description: Base version (before the Homebrew build comma), or the full build version (0.1,49) on an entry for one build with notes of its own
        versionBase:
          type: string
          description: Version before the Homebrew build comma; equals version except on build entries
        build:
          type: string
          description: 'Only on entries for one Homebrew build with notes of its own: the text after the first comma (0.1,49 gives 49). Builds without their own notes share the entry of their base version.'
        title:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        brewCommittedAt:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum:
          - github_release
          - sparkle
          - webpage
          - manual
          - homebrew
          - editorial
        sourceUrl:
          type: string
          nullable: true
        isLatest:
          type: boolean
        isPrerelease:
          type: boolean
        hasNotes:
          type: boolean
        summary:
          type: string
          nullable: true
        sections:
          type: array
          items:
            "$ref": "#/components/schemas/ReleaseSection"
        bodyMarkdown:
          type: string
          nullable: true
        translation:
          "$ref": "#/components/schemas/TranslationInfo"
        sourceLocale:
          "$ref": "#/components/schemas/Locale"
        machineTranslated:
          type: boolean
          description: Whether the returned text is machine-translated; false for source fallback or manual translations.
    TranslationInfo:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - none
          - source
          - machine
          - manual
          - pending
          - failed
          - skipped
          description: source is original text, machine is machine translation and manual is a correction. Editorial release notes never expose pending/failed or stale translated text; pending also represents a missing translation. Other content may retain old translations while pending/failed. none/skipped preserve legacy no-translation semantics.
        locale:
          type: string
          allOf:
          - "$ref": "#/components/schemas/Locale"
          nullable: true
        sourceLocale:
          "$ref": "#/components/schemas/Locale"
        machineTranslated:
          type: boolean
          description: Whether the returned text is machine-translated; false for source fallback or manual translations.
    PackageIndexing:
      type: object
      required:
      - indexable
      - reason
      - locales
      - enforced
      - notesCount
      - pages
      description: Index decision for the app's pages (WP11). Pages outside locales, or with indexable false, render noindex and stay out of hreflang and the sitemap.
      properties:
        detailsMerged:
          type: boolean
          description: Overview facts include the original details fields.
        detailsRedirect:
          type: boolean
          description: Rollout enabled and this locale has an indexable overview; false for link apps.
        indexable:
          type: boolean
        reason:
          type: string
          nullable: true
          description: hidden, forced_noindex, unavailable, missing_summary or thin when not indexable.
        locales:
          type: array
