        offers:
          type: array
          items:
            "$ref": "#/components/schemas/PriceFact"
        requirements:
          type: array
          items:
            "$ref": "#/components/schemas/RequirementFact"
        uninstall:
          type: array
          items:
            "$ref": "#/components/schemas/UninstallFact"
        overview:
          "$ref": "#/components/schemas/OverviewFacts"
        alternatives:
          type: array
          items:
            "$ref": "#/components/schemas/PackageAlternative"
        price:
