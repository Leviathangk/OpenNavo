    PackageIndexing:
      type: object
      required: ["indexable","reason","locales","enforced","notesCount","pages"]
      description: "Index decision for the app's pages (WP11). Pages outside locales, or with indexable false, render noindex and stay out of hreflang and the sitemap."
      properties:
        detailsMerged:
          type: boolean
          description: Overview facts include the original details fields.
        detailsRedirect:
          type: boolean
          description: Rollout enabled and this locale has an indexable overview; false for link apps.
        indexable:
          type: boolean
        reason:
          type: string
          nullable: true
          description: hidden, forced_noindex, unavailable, missing_summary or thin when not indexable.
        locales:
          type: array
          items:
            $ref: "#/components/schemas/Locale"
        enforced:
          type: boolean
          description: Whether the index policy applies to this app. While false, pages keep today's behaviour.
        notesCount:
          type: integer
          minimum: 0
          description: Visible releases with their own notes; the versions page needs several to be indexed on its own.
        pages:
          $ref: "#/components/schemas/PackagePageDecisions"
      example:
        indexable: true
        reason: null
        locales:
          - en-US
          - zh-CN
          - ja-JP
          - es-ES
          - pt-BR
          - ru-RU
        enforced: false
        notesCount: 12
        pages:
          overview:
            robots: noindex, follow
            canonicalPath: ""
            hreflang: &a1 []
            inSitemap: false
            announce: false
            reason: locale_not_ready
          versions:
            robots: noindex, follow
            canonicalPath: ""
            hreflang: *a1
            inSitemap: false
            announce: false
            reason: locale_not_ready
          dependencies:
            robots: noindex, follow
            canonicalPath: ""
            hreflang: *a1
            inSitemap: false
            announce: false
            reason: locale_not_ready
          details:
            robots: noindex, follow
            canonicalPath: ""
            hreflang: *a1
            inSitemap: false
            announce: false
            reason: consolidated
    AppPrice:
      type: object
      required: [type, amount, currency, region, plan, period, appVersion, sourceUrl, method, verifiedAt, stale, offer]
      description: 'Verified price type with its evidence (WP12). Absent when unknown or marked for review; a free download never implies free.'
      properties:
        type:
          type: string
          enum: [free, free_with_iap, paid, subscription, trial]
          example: subscription
        amount:
          type: number
          format: double
          nullable: true
          example: 9.99
        currency:
          type: string
          nullable: true
          example: USD
        region:
          type: string
          nullable: true
          description: 'ISO 3166-1 country the price was checked for'
          example: US
        plan:
          type: string
          nullable: true
          description: 'Vendor plan name as the vendor writes it; not translated'
          example: Pro
        period:
          type: string
          nullable: true
          enum: [one_time, month, year]
          example: month
        appVersion:
          type: string
          nullable: true
          example: '5.2'
        sourceUrl:
          type: string
          example: https://vendor.example/pricing
        method:
          type: string
          enum: [vendor_site, app_store, vendor_docs, in_app, other]
          example: vendor_site
        verifiedAt:
          type: string
          format: date-time
          example: 2026-10-13T08:00:00Z
        stale:
          type: boolean
          description: 'Verified more than 365 days ago: show the date as possibly outdated'
          example: false
        offer:
          type: boolean
          description: 'Structured data may publish an offer: current, and free to obtain (price 0) or a complete amount with currency, region and plan'
          example: true
      example:
        type: free
        amount: null
        currency: null
        region: null
        plan: null
        period: null
        appVersion: '2.4'
        sourceUrl: https://vendor.example/download
        method: vendor_site
        verifiedAt: 2026-10-13T08:00:00Z
        stale: false
        offer: true
    HomebrewStatus:
      type: object
