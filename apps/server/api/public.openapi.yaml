  /site/indexnow-keys/{key}:
    get:
      tags:
        - site
      operationId: verifyIndexNowKey
      summary: 'Confirm the IndexNow key file name'
      description: 'Returns the key when IndexNow is enabled and the path matches the stored key, so the web server can serve /{key}.txt without learning the key in advance. Any other key returns 404.'
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{8,128}$'
            example: example-indexnow-key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexNowKeyResponse'
              examples:
                en-US:
                  summary: en-US
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      key: example-indexnow-key
                zh-CN:
                  summary: zh-CN
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      key: example-indexnow-key
                ja-JP:
