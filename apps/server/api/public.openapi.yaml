  /collections/{slug}/brewfile:
    get:
      tags:
        - collections
      operationId: getCollectionBrewfile
      summary: 'Export a collection as a plain-text Brewfile'
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: 'Brewfile text'
          content:
            text/plain:
              schema:
                type: string
              example: |
                cask "visual-studio-code"
                cask "ghostty"
                brew "ripgrep"
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /catalog/links:
    get:
      tags:
        - desktop
      operationId: getCatalogLinks
      summary: Full external software links catalog
      description: Independent of the legacy snapshot and changes protocol. Send If-None-Match to reuse the cached full catalog.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Full catalog
          headers:
            ETag:
              schema:
                type: string
            Vary:
              schema:
                type: string
              example: Origin, Accept-Language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogLinksResponse'
              examples:
                en-US:
                  value:
                    code: '0000'
                    msg: ok
                    data:
