  /browse:
    get:
      tags: [catalog]
      operationId: getBrowse
      summary: Indexable apps or fonts grouped by localized display name
      parameters:
        - name: kind
          in: query
          schema: {type: string, enum: [apps, fonts], default: apps}
        - name: bucket
          in: query
          schema: {type: string, pattern: '^([a-z]|0-9|other)?$'}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Directory buckets and at most 300 leaf links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseResponse'
              examples:
                en-US:
                  value: {code: '0000', msg: ok, data: {buckets: [], items: []}}
                zh-CN:
                  value: {code: '0000', msg: ok, data: {buckets: [], items: []}}
