        bots: [ClaudeBot]
    SiteSettings:
      type: object
      required: [revision, identity, verification, analytics, edgeCache, crawlers, pages]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: 'Increments on every admin save; use it to key caches.'
        identity:
          type: object
          required: [name, alternateNames, logoUrl, sameAs]
          properties:
            name:
              type: string
            alternateNames:
              type: array
              items:
                type: string
            logoUrl:
              type: string
            sameAs:
              type: array
              items:
                type: string
        verification:
          type: object
          required: [google, bing]
          properties:
            google:
              type: string
            bing:
              type: string
        analytics:
          type: object
          required: [ga4Enabled, ga4MeasurementId, consentRegions]
          properties:
            usageEnabled:
              type: boolean
              default: false
            ga4Enabled:
              type: boolean
            ga4MeasurementId:
              type: string
            consentRegions:
              type: array
              items:
                type: string
        edgeCache:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
        crawlers:
          type: object
          required: [training, seoTools]
          properties:
            training:
              $ref: '#/components/schemas/SiteCrawlerRule'
            seoTools:
              $ref: '#/components/schemas/SiteCrawlerRule'
        pages:
          type: object
          required: [titleTemplate, indexPolicy, versionsSitemap]
          properties:
            titleTemplate:
              type: string
              enum: [new, legacy]
            indexPolicy:
              type: object
              required: [mode, scope, since]
              properties:
                mode:
                  type: string
                  enum: ['off', shadow, enforce]
                scope:
                  type: string
                  enum: [new, all]
                since:
                  type: string
            translationMode:
              type: string
              enum: [shadow, enforce]
              default: shadow
              description: Published translation quality rollout; new site-only languages are always enforced.
            translationLocales:
              type: array
              uniqueItems: true
              description: Locales to enforce; empty means all locales.
              items:
                $ref: '#/components/schemas/Locale'
            versionsMinNotesChars:
              type: integer
              minimum: 1
              maximum: 100000
              default: 300
            openLocales:
              type: array
              uniqueItems: true
              description: Languages open for non-entity pages; defaults to the six application languages. Entity pages use their own PageDecision.
              default: [en-US, zh-CN, ja-JP, es-ES, pt-BR, ru-RU]
              items:
                $ref: '#/components/schemas/Locale'
            intentPagesEnabled:
              type: boolean
              default: false
              description: Enable qualified intent pages backed by confirmed search demand and unique targets.
            detailsRedirect:
              type: boolean
              default: false
              description: Enable details redirects after migrated overview content has been verified.
            versionsSitemap:
              type: boolean
