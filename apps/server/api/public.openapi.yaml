openapi: 3.0.3
info:
  title: OpenNavo Public API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://opennavo.example/terms
  description: 'Public API for the web and macOS clients.


    - All response bodies use `{code, msg, data}`; success is `code = "0000"`.

    - Public endpoints use semantic HTTP status codes; errors have null data.

    - Fields use camelCase; timestamps use RFC 3339 (UTC).

    - Localization prefers the `locale` query parameter, then `Accept-Language`, and defaults to `en-US`.

    - Pagination requests use `current` (starting at 1) and `size`; responses use `{current, size, total, records}`.


    M8-02: all catalog responses, snapshots and deltas contain Casks only; explicit kind=formula returns 404. Formula dependencies of Casks retain names but have no catalog links.

    Content-language negotiation prefers locale over Accept-Language (by q value), defaulting to en-US. Content falls back from the requested language to en-US, then the object''s source language. Optional sourceLocale identifies the source language; machineTranslated describes the text actually returned. Select Prism''s static content-language examples with Prefer: example=<locale-code>; locale does not switch them automatically.'
servers:
  - url: https://api.opennavo.example/api/v1
  - url: http://localhost:8080/api/v1
security: []
tags:
  - name: usage
    description: Opted-in anonymous daily activity
  - name: home
    description: 'Home'
  - name: catalog
    description: 'Catalog: categories, package lists, details and dependencies'
  - name: releases
    description: 'Release history'
  - name: search
    description: 'Search and suggestions'
  - name: rankings
    description: 'Installation rankings'
  - name: collections
    description: 'Collections'
  - name: desktop
    description: 'Client-specific: snapshots, deltas, configuration and releases'
  - name: feedback
    description: 'User feedback'
  - name: site
    description: 'Website configuration: SEO and analytics settings'
  - name: articles
    description: 'Published articles and author pages'

paths:
  /seo/experiment:
    get:
      tags: [site]
      operationId: getSeoExperimentAssignment
      summary: Get the stable template experiment assignment for a canonical page
      description: Render a variant only when eligible is true and arm is treatment. The web layer renders titles; this response never overrides factual page eligibility.
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
            maxLength: 2048
            example: https://opennavo.example/apps/example-editor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeoExperimentAssignmentResponse'
              examples:
                en-US:
                  summary: en-US
                  value: {code: '0000', msg: ok, data: {experimentId: null, arm: none, variant: null, templateVersion: snippet-v1, eligible: false, expiresAt: null}}
                zh-CN:
