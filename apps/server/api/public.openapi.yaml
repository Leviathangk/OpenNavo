  /catalog/update-feeds:
    get:
      tags:
        - desktop
      operationId: getCatalogUpdateFeeds
      summary: Full verified update feed rules
      description:
        Independent full Sparkle rule list, with stable ETag and If-None-Match support. Contains only enabled rules
        verified at least once. Does not alter catalog snapshots or changes.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Full catalog
          headers:
            ETag:
              schema:
                type: string
            Vary:
              schema:
                type: string
              example: Origin, Accept-Language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogUpdateFeedsResponse'
              examples:
                en-US:
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      etag: '"example"'
                      items: []
                zh-CN:
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      etag: '"example"'
                      items: []
                ja-JP:
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      etag: '"example"'
                      items: []
                es-ES:
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      etag: '"example"'
                      items: []
                pt-BR:
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      etag: '"example"'
                      items: []
                ru-RU:
                  value:
                    code: '0000'
                    msg: ok
                    data:
                      etag: '"example"'
                      items: []
                de-DE:
                  $ref: '#/paths/~1catalog~1update-feeds/get/responses/200/content/application~1json/examples/en-US'
                fr-FR:
                  $ref: '#/paths/~1catalog~1update-feeds/get/responses/200/content/application~1json/examples/en-US'
                it-IT:
                  $ref: '#/paths/~1catalog~1update-feeds/get/responses/200/content/application~1json/examples/en-US'
                zh-Hant:
                  $ref: '#/paths/~1catalog~1update-feeds/get/responses/200/content/application~1json/examples/en-US'
        '304':
          description: The catalog has not changed
          headers:
            ETag:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Locale:
      name: locale
      in: query
      schema:
        $ref: '#/components/schemas/Locale'
      description: 'locale > Accept-Language (six languages matched by q value) > en-US. Missing translations fall back to en-US, then the source language.'
    KindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PackageKind' }
    KindQuery:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/PackageKind' }
    TokenPath:
      name: token
      in: path
      required: true
      description: 'Homebrew token; may contain `@`, for example `python@3.14`'
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9@._+-]*$', maxLength: 128, example: visual-studio-code }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$', maxLength: 64, example: new-mac }
    ArticleSlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 100, example: choose-a-screenshot-app }
    AuthorSlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 80, example: lin-wei }
    Current:
      name: current
      in: query
      schema: { type: integer, minimum: 1, default: 1, example: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24, example: 24 }

  responses:
    Error:
      description: 'Error response; see the domain error codes in apps/server/internal/domain. data is null.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SeoExperimentAssignmentResponse:
      type: object
      additionalProperties: false
      required: [code, msg, data]
      properties:
        code:
          type: string
          example: '0000'
        msg:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/SeoExperimentAssignment'
      example: {code: '0000', msg: ok, data: {experimentId: null, arm: none, variant: null, templateVersion: snippet-v1, eligible: false, expiresAt: null}}
    SeoExperimentAssignment:
      type: object
      additionalProperties: false
      required: [experimentId, arm, variant, templateVersion, eligible, expiresAt]
      properties:
        experimentId:
          type: integer
          format: int64
          nullable: true
          example: null
        arm:
          type: string
          enum: [none, control, treatment]
          example: none
        variant:
          type: string
          nullable: true
          enum: [verified_free, current_version, uninstall_alternatives, null]
          example: null
        templateVersion:
          type: string
          example: snippet-v1
        eligible:
          type: boolean
          example: false
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
      example: {experimentId: null, arm: none, variant: null, templateVersion: snippet-v1, eligible: false, expiresAt: null}
    ImageVariant:
      type: object
      required:
        - width
        - height
        - url
        - type
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
        type:
          type: string
          enum:
            - image/webp
      additionalProperties: false
      example:
        width: 64
        height: 64
        url: https://cdn.example.test/icon-64.webp
        type: image/webp
    AppIntegrationFact:
      type: object
      required:
        - kind
        - name
        - repositoryUrl
        - version
        - installation
        - clients
        - permissions
        - appleSilicon
        - versions
        - evidence
      properties:
        kind:
          type: string
          enum:
            - mcp
            - skill
        name:
          type: string
          minLength: 1
          maxLength: 160
        appVersion:
          type: string
          maxLength: 100
        repositoryUrl:
          type: string
          format: uri
        version:
          type: string
          minLength: 1
