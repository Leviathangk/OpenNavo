    SiteCrawlerRule:
      type: object
      required: [mode, delaySeconds, bots]
      description: 'Rule for one tunable crawler class. Search engines and user-requested fetchers always use the default group.'
      properties:
        mode:
          type: string
          enum: [allow, limit, block]
        delaySeconds:
          type: integer
