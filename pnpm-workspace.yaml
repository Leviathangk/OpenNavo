ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'

linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - vue-demi

shamefullyHoist: true

# Target exact vulnerable transitive versions; avoid unrelated major upgrades.
overrides:
  'dompurify@<3.4.17': 3.4.17
  'micromatch@4.0.7': 4.0.8
  'fflate@0.7.3': 0.7.5
  'simple-git@3.36.0': 4.0.2

  'tinypool@2.1.0': 2.2.0
  'lodash@<4.18.1': 4.18.1
  'tmp@<0.2.7': 0.2.7
  'uuid@8.3.2': 11.1.1
  'basic-ftp@5.3.1': 6.2.2
  'esbuild@0.27.7': 0.28.2

# Local fixes to published packages; each patch explains itself at the changed lines.
patchedDependencies:
  nuxt-og-image@6.10.3: patches/nuxt-og-image@6.10.3.patch
