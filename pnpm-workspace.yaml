  '@resvg/resvg-js': ^2.6.2
  '@soybeanjs/eslint-config-vue': ^0.0.2
  '@stoplight/prism-cli': ^5.0.0
  '@tauri-apps/api': ~2.12.0
  '@tauri-apps/cli': ~2.12.0
  '@tauri-apps/plugin-dialog': ~2.8.1
  '@tauri-apps/plugin-opener': ~2.7.0
