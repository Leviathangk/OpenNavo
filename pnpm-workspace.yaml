  '@types/node': ~25.7.0
  '@unocss/nuxt': ~66.6.0
  '@unocss/reset': ~66.6.0
  '@vitejs/plugin-vue': ^6.0.0
  '@vitest/coverage-v8': ^5.0.0
  '@vue/test-utils': ^2.5.0
  '@vueuse/core': ^14.0.0
  eslint: ~10.3.0
