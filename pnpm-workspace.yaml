  jsdom: ^29.0.0
  markdown-it: ^15.0.2
  naive-ui: ~2.44.1
  nuxt: ~4.5.0
  openapi-fetch: ~0.17.0
  openapi-typescript: ~7.13.0
  oxfmt: ^0.49.0
  oxlint: ^1.64.0
  pinia: ~3.0.0
  satori: ^0.35.0
  subset-font: ^2.9.0
  typescript: ~6.0.0
