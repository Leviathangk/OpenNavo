name: Release CI gate
on:
  workflow_call:
    inputs:
      desktop:
        description: Also require Desktop CI, which production deploys do not wait for
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node .github/scripts/require-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_DESKTOP_CI: ${{ inputs.desktop }}
