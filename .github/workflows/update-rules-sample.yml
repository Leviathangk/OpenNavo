name: Weekly update rule identity sample

on:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-rules-sample
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Resolve rotating public vendor metadata without database access
        working-directory: apps/server
        run: go run ./cmd/update-feeds-probe --real-read-only --sample 3 > "$RUNNER_TEMP/update-sample.json"
      - name: Download only into temporary directories and verify declared identity
        working-directory: apps/desktop/src-tauri
        run: cargo run --locked --example update_sample_probe -- --real-read-only --manifest "$RUNNER_TEMP/update-sample.json"
