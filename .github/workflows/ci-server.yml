name: Backend CI

# Every event runs this workflow; .github/scripts/changes.mjs decides which jobs
# run. Pull requests get fast checks (lint, unit tests, build, contract) for the
# areas they touch; main, the nightly run, dispatched runs and pull requests
# labelled full-ci add the integration suite with -race.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.changes.outputs.server }}
      mcp: ${{ steps.changes.outputs.mcp }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: changes
        run: node .github/scripts/changes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/ci-mcp.yml

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: contract
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: pnpm exec redocly lint apps/server/api/public.openapi.yaml apps/server/api/admin.openapi.yaml --config apps/server/api/redocly.yaml
      - run: make gen-server
      - run: git diff --exit-code
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ../../.github/workflows/*.yml
        working-directory: apps/server
      - uses: ./.github/actions/go-cache-save
        with:
          name: contract

  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: lint
          paths: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: make lint-server
      - uses: ./.github/actions/go-cache-save
        with:
          name: lint
          paths: |
            ~/.cache/go-build
            ~/.cache/golangci-lint

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: opennavo
          POSTGRES_USER: opennavo
          POSTGRES_PASSWORD: opennavo-dev-only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U opennavo -d opennavo"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: unit
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: make migrate seed
      - run: go test ./...
        working-directory: apps/server
      - run: go tool govulncheck ./...
        working-directory: apps/server
      - run: make build-server
      - uses: ./.github/actions/go-cache-save
        with:
          name: unit

  # Integration tests start PostgreSQL/Redis containers for each case; run serially
  # they took 22 minutes, 20 of them in internal/http. Six shards split them by
  # the durations the last green main run recorded, longest first
  # (.github/scripts/go-shard.mjs); without recordings they are dealt in turn.
  integration-plan:
    needs: changes
    if: needs.changes.outputs.server == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      patterns: ${{ steps.plan.outputs.patterns }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            apps/server
      - name: Fetch recorded test durations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in $(gh run list --workflow ci-server.yml --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --pattern 'integration-durations-*' --dir "$RUNNER_TEMP/durations" 2>/dev/null; then
              echo "durations recorded by run $id"
              break
            fi
          done
      - id: plan
        run: echo "patterns=$(node .github/scripts/go-shard.mjs apps/server 6 "$RUNNER_TEMP/durations")" >> "$GITHUB_OUTPUT"

  server-integration:
    needs: [changes, integration-plan]
    if: needs.changes.outputs.server == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      # Every test terminates its own containers and the runner is discarded
      # afterwards; the shared reaper container only added a startup race.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: integration
      # Some tests run the repository's Node scripts (interface i18n replay).
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - name: go test
        working-directory: apps/server
        # An explicit bash shell runs with -o pipefail: without it the step took the log filter's exit status and
        # reported failing integration tests as passing.
        shell: bash
        env:
          PATTERN: ${{ fromJSON(needs.integration-plan.outputs.patterns)[matrix.shard] }}
        run: go test -race -tags=integration -timeout 25m -json -run "$PATTERN" ./... | node ../../.github/scripts/go-test-log.mjs "$RUNNER_TEMP/durations-${{ matrix.shard }}.json"
      # Recordings from main balance the next full runs.
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: integration-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: ignore
      - if: matrix.shard == 0
        uses: ./.github/actions/go-cache-save
        with:
          name: integration

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tooling/scripts/tasks/server.mjs deploy-lint
