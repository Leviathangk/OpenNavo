name: Backend CI

# Every event runs this workflow; .github/scripts/changes.mjs decides which jobs
# run. Pull requests get fast checks (lint, unit tests, build, contract) for the
# areas they touch; main, the nightly run, dispatched runs and pull requests
# labelled full-ci add the integration suite with -race.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.changes.outputs.server }}
      mcp: ${{ steps.changes.outputs.mcp }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: changes
        run: node .github/scripts/changes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/ci-mcp.yml

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: pnpm exec redocly lint apps/server/api/public.openapi.yaml apps/server/api/admin.openapi.yaml --config apps/server/api/redocly.yaml
      - run: make gen-server
      - run: git diff --exit-code
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ../../.github/workflows/*.yml
        working-directory: apps/server

  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # golangci-lint keeps per-package results, so packages a change does not
      # touch are not analysed again. Main saves a fresh entry; PRs restore it.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('apps/server/go.sum', 'apps/server/.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('apps/server/go.sum', 'apps/server/.golangci.yml') }}-
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: make lint-server

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: opennavo
          POSTGRES_USER: opennavo
          POSTGRES_PASSWORD: opennavo-dev-only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U opennavo -d opennavo"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: make migrate seed
      - run: go test ./...
        working-directory: apps/server
      - run: go tool govulncheck ./...
        working-directory: apps/server
      - run: make build-server

  # Integration tests start PostgreSQL/Redis containers for each case; run serially
  # they took 22 minutes, 20 of them in internal/http. Six shards each take a
  # sixth of every package's tests (.github/scripts/go-shard.mjs).
  server-integration:
    needs: changes
    if: needs.changes.outputs.server == 'true' && needs.changes.outputs.full == 'true'
    name: server-integration (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      # Every test terminates its own containers and the runner is discarded
      # afterwards; the shared reaper container only added a startup race.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # Some tests run the repository's Node scripts (interface i18n replay).
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter opennavo --ignore-scripts
      - run: go test -race -tags=integration -timeout 25m -run "$(node ../../.github/scripts/go-shard.mjs . ${{ matrix.shard }} 6)" ./...
        working-directory: apps/server

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tooling/scripts/tasks/server.mjs deploy-lint
