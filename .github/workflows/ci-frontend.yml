name: Frontend CI

# Web, admin, desktop web view, and shared packages (09 section 6.1). Backend/contract checks: ci-server.yml;
# the desktop's Rust, Swift and Tauri builds: ci-desktop.yml.
# Every event runs this workflow; .github/scripts/changes.mjs decides which jobs
# run. Pull requests get static checks, unit tests and builds for the areas they
# touch. Main, the nightly run, dispatched runs and pull requests labelled
# full-ci add the full-stack E2E with Lighthouse.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: changes
        run: node .github/scripts/changes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The former single frontend job, split so its parts run side by side.
  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          name: frontend-static
      - run: pnpm install --frozen-lockfile
      # Generated tokens, API types, and icon subsets must match committed output; IPC bindings require Rust and are checked in Desktop CI (ci-desktop.yml).
      - run: pnpm --filter "./packages/*" run gen
      - run: git diff --exit-code
      - run: pnpm run format:check
      # Repository-wide i18n gates of `make lint-web`: interface locks, hard-coded copy, the README
      # brand block, and Traditional Chinese derived with the Go converter (hence setup-go).
      - run: node tooling/scripts/check-interface-i18n.mjs
      - run: node tooling/scripts/check-hardcoded-i18n.mjs
      - run: node tooling/scripts/sync-brand-readme.mjs --check
      - run: node tooling/scripts/derive-traditional.mjs --check
      - run: node --test tooling/scripts/traditional-markdown.test.mjs
      - run: pnpm --filter "@opennavo/*" --if-present run lint
      - run: pnpm --filter "@opennavo/*" --if-present run typecheck
      - uses: ./.github/actions/go-cache-save
        with:
          name: frontend-static

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          node --test tooling/scripts/check-hardcoded-i18n.test.mjs tooling/scripts/derive-traditional.test.mjs
          tooling/scripts/sync-brand-readme.test.mjs apps/web/scripts/og-font.test.mjs
      - run: pnpm --filter "@opennavo/*" --if-present run test

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opennavo/web --filter @opennavo/admin --filter @opennavo/desktop --filter @opennavo/ui run build
      - run: node tooling/scripts/check-desktop-mock-release.mjs
      - run: pnpm --filter @opennavo/web test:ssr

  # Admin menu/permission E2E (intercepted API; no backend required).
  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @opennavo/admin run e2e

  # Full-stack web E2E (05 section 10): the composite action starts isolated PostgreSQL/Redis/MinIO and the seeded E2E API on 18082.
  # Write frontend environment variables to GITHUB_ENV; always remove dedicated containers and volumes (03 section 5.5).
  web-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/e2e-backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @opennavo/web run e2e
      # Full-stack admin cases (07 section 9) reuse the E2E stack; Playwright starts the admin dev server, with Vite proxying to 18082.
      - run: pnpm --filter @opennavo/admin exec playwright test e2e/stack.spec.ts
      - if: always()
        run: node tooling/scripts/tasks/server.mjs e2e-down --ci

  # Detail-page Lighthouse (10 M2-08, 05 section 8) on its own runner beside web-e2e, against its own seeded stack:
  # production build with a proxy simulating Caddy compression; performance scores warn only in CI.
  web-lighthouse:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web-e2e saves the stack's caches; both jobs would write the same entries.
      - uses: ./.github/actions/e2e-backend
        with:
          save-cache: 'false'
      - run: pnpm --filter @opennavo/web build
      - name: Lighthouse
        working-directory: apps/web
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: '3000'
          NUXT_API_BASE_INTERNAL: http://127.0.0.1:18082/api/v1
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:18082/api/v1
          NUXT_PUBLIC_SITE_URL: http://localhost:3100
          NUXT_PUBLIC_I18N_BASE_URL: http://localhost:3100
        run: |
          node .output/server/index.mjs &
          preview_pid=$!
          PORT=3100 UPSTREAM_PORT=3000 node scripts/compress-proxy.mjs &
          proxy_pid=$!
          trap 'kill "$proxy_pid" "$preview_pid" 2>/dev/null || true; wait "$proxy_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$preview_pid" "$proxy_pid"
            curl -sf -o /dev/null http://localhost:3100/apps/visual-studio-code && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3100/apps/visual-studio-code
          pnpm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          if-no-files-found: ignore
      - if: always()
        run: node tooling/scripts/tasks/server.mjs e2e-down --ci
