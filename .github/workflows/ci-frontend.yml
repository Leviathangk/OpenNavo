name: Frontend CI

# Web, admin, desktop, and shared packages (09 section 6.1). Backend/contract checks: ci-server.yml.
# Every event runs this workflow; .github/scripts/changes.mjs decides which jobs
# run. Pull requests get static checks, unit tests and builds for the areas they
# touch; desktop (Rust, Swift, Tauri) only for desktop changes. Main, the nightly
# run, dispatched runs and pull requests labelled full-ci add the full-stack
# E2E with Lighthouse.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      desktop: ${{ steps.changes.outputs.desktop }}
      e2e: ${{ steps.changes.outputs.e2e }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: changes
        run: node .github/scripts/changes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The former single frontend job, split so its parts run side by side.
  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated tokens, API types, and icon subsets must match committed output; IPC bindings require Rust and are checked in the desktop job.
      - run: pnpm --filter "./packages/*" run gen
      - run: git diff --exit-code
      - run: pnpm run format:check
      - run: pnpm --filter "@opennavo/*" --if-present run lint
      - run: pnpm --filter "@opennavo/*" --if-present run typecheck

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@opennavo/*" --if-present run test

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opennavo/web --filter @opennavo/admin --filter @opennavo/desktop --filter @opennavo/ui run build
      - run: pnpm --filter @opennavo/web test:ssr

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: python3 tooling/scripts/check-notices.py --check-rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opennavo/desktop run gen
      - run: git diff --exit-code apps/desktop/src/ipc/bindings.ts
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - name: Check firewall policy and optional bundle preparation
        run: |
          cargo fmt --check --manifest-path apps/desktop/native/firewall/core/Cargo.toml
          cargo clippy --locked --manifest-path apps/desktop/native/firewall/core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/desktop/native/firewall/core/Cargo.toml
          python3 -m unittest discover -s apps/desktop/scripts -p test_prepare_firewall.py
          python3 apps/desktop/scripts/prepare-firewall.py --config-out "$RUNNER_TEMP/firewall-unbundled.json"
          python3 apps/desktop/scripts/prepare-firewall.py --compile-only "$RUNNER_TEMP/firewall-link-check" --target aarch64-apple-darwin
          cargo run --manifest-path apps/desktop/src-tauri/Cargo.toml --example firewall_probe
      - run: swift test --package-path apps/desktop/native/store
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install standalone engine build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/clamav-tools"
          "$RUNNER_TEMP/clamav-tools/bin/pip" install cmake==4.1.2 ninja==1.13.0
          echo "$RUNNER_TEMP/clamav-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/clamav
          key: clamav-1.5.4-macos15-aarch64-apple-darwin-${{ hashFiles('apps/desktop/native/clamav/**') }}
      - name: Build standalone ClamAV for the debug bundle
        run: |
          python3 apps/desktop/native/clamav/build.py --work "$RUNNER_TEMP/clamav" --arch arm64
          echo "OPENNAVO_CLAMAV_DIR=$RUNNER_TEMP/clamav/artifacts/arm64" >> "$GITHUB_ENV"
      # Unsigned debug builds; signing, notarization, and updater artifacts are handled by release-desktop.yml (M5-03).
      # With an updater public key, Tauri requires the private signing key; forks/PRs lack it, so disable updater artifacts here.
      - run: pnpm --filter @opennavo/desktop tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

  # Admin menu/permission E2E (intercepted API; no backend required).
  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @opennavo/admin run e2e

  # Full-stack web E2E (05 section 10): the composite action starts isolated PostgreSQL/Redis/MinIO and the seeded E2E API on 18082.
  # Write frontend environment variables to GITHUB_ENV; always remove dedicated containers and volumes (03 section 5.5).
  web-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/e2e-backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @opennavo/web run e2e
      # Full-stack admin cases (07 section 9) reuse the E2E stack; Playwright starts the admin dev server, with Vite proxying to 18082.
      - run: pnpm --filter @opennavo/admin exec playwright test e2e/stack.spec.ts
      # Detail-page Lighthouse (10 M2-08, 05 section 8): production build with a proxy simulating Caddy compression; performance scores warn only in CI.
      - run: pnpm --filter @opennavo/web build
      - name: Lighthouse
        working-directory: apps/web
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: '3000'
          NUXT_API_BASE_INTERNAL: http://127.0.0.1:18082/api/v1
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:18082/api/v1
          NUXT_PUBLIC_SITE_URL: http://localhost:3100
          NUXT_PUBLIC_I18N_BASE_URL: http://localhost:3100
        run: |
          node .output/server/index.mjs &
          preview_pid=$!
          PORT=3100 UPSTREAM_PORT=3000 node scripts/compress-proxy.mjs &
          proxy_pid=$!
          trap 'kill "$proxy_pid" "$preview_pid" 2>/dev/null || true; wait "$proxy_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$preview_pid" "$proxy_pid"
            curl -sf -o /dev/null http://localhost:3100/apps/visual-studio-code && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3100/apps/visual-studio-code
          pnpm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          if-no-files-found: ignore
      - if: always()
        run: node tooling/scripts/tasks/server.mjs e2e-down --ci
