name: MCP CI
# Called by Backend CI when MCP paths change (see .github/scripts/changes.mjs)
# and by release-mcp.yml; no own push or pull request trigger, so it never runs twice.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: apps/mcp/uv.lock
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked python scripts/generate.py --check
      - run: uv run --locked pytest
      - run: uv build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        # Keep GitHub event data out of logs and downloadable build records.
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          provenance: false
          context: apps/mcp
          push: false
          tags: opennavo-mcp:ci
