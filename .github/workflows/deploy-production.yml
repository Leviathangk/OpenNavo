name: Deploy production
# The revision in the title lets ship.mjs see whether a commit already deployed.
run-name: Deploy production ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit on main with successful CI
        required: true
        default: main
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      # Run the gate from the workflow commit, not inputs.revision, so rolling back to a
      # commit that predates deployment-needed.mjs still works.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/deployment-needed.mjs
            .github/scripts/ship.mjs
          sparse-checkout-cone-mode: false
          path: .workflow-ci
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node .github/scripts/require-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: changes
        run: node .workflow-ci/.github/scripts/deployment-needed.mjs
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  images:
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: apps/server
            file: apps/server/Dockerfile
            target: server
          - name: web
            context: .
            file: apps/web/Dockerfile
            target: ''
          - name: mcp
            context: apps/mcp
            file: apps/mcp/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@v7
        # Keep GitHub event data out of logs and downloadable build records.
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          provenance: false
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/opennavo/opennavo-${{ matrix.name }}:sha-${{ needs.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          cache-from: type=gha,scope=production-${{ matrix.name }}
          cache-to: type=gha,scope=production-${{ matrix.name }},mode=max
      - name: Record immutable image
        env:
          KIND: ${{ matrix.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p image-manifests
          python3 - <<'PY'
          import os,json,pathlib
          kind=os.environ['KIND']
          pathlib.Path('image-manifests',kind+'.json').write_text(json.dumps({kind:'ghcr.io/opennavo/opennavo-'+kind+'@'+os.environ['DIGEST']}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: image-${{ matrix.name }}
          path: image-manifests/
  admin:
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@opennavo/admin..."
      - run: pnpm --filter @opennavo/admin build
      - run: |
          mkdir -p apps/admin/dist/third-party
          cp -R docs/legal/third-party/. apps/admin/dist/third-party/
          tar -czf admin-dist.tar.gz -C apps/admin/dist .
      - uses: actions/upload-artifact@v6
        with:
          name: production-admin
          path: admin-dist.tar.gz
  deploy:
    needs: [source, images, admin]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v6
        with:
          pattern: image-*
          merge-multiple: true
          path: deployment/images
      - uses: actions/download-artifact@v6
        with:
          name: production-admin
          path: deployment
      - name: Read public top paths from Cloudflare analytics
        env:
          CF_API_TOKEN: ${{ secrets.CF_ANALYTICS_READ_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if ! python3 ops/cf-readonly.py top --minutes 1440 > deployment/warm-paths.json; then
            echo '::warning::Cloudflare analytics unavailable; using fixed public warm paths.'
            python3 - <<'PY'
          import json
          from pathlib import Path
          Path('deployment/warm-paths.json').write_text(json.dumps({'paths': [
              '/', '/zh', '/ja', '/es', '/ru', '/download', '/zh/download', '/ja/download',
              '/es/download', '/ru/download', '/apps', '/recent', '/ru/apps', '/es/recent',
              '/apps/airbuild', '/apps/agentide'
          ]}) + '\n')
          PY
          fi
      - name: Deploy immutable images and verify production
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: python3 .github/scripts/send-deployment.py
      - name: Warm approved public HTML at the edge after deployment
        continue-on-error: true
        timeout-minutes: 6
        run: |
          if ! python3 ops/warm-edge.py deployment/warm-paths.json --max-seconds 300; then
            echo '::warning::Edge warmup failed after the deployment; the release remains successful.'
          fi
