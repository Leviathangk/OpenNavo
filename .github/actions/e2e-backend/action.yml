name: OpenNavo E2E backend
description: Start isolated PostgreSQL, Redis, MinIO and seeded API for frontend tests
inputs:
  save-cache:
    description: Whether this job saves the stack's image and Go build caches on main (one job per run should)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: apps/server/go.mod
        cache: false
    - uses: ./.github/actions/go-cache
      with:
        name: e2e
    # Image layers go to the GitHub Actions cache (ops/docker-compose.e2e.ci.yml):
    # a buildx builder that can export them, and the runtime variables compose
    # needs to reach the cache service.
    - uses: docker/setup-buildx-action@v4
    - uses: crazy-max/ghaction-github-runtime@v4
    - name: Start seeded backend
      shell: bash
      run: python3 ops/e2e.py up --ci
      env:
        RUNNER_TRACKING_ID: ''
        # Pull requests read the image cache; only main writes it.
        OPENNAVO_E2E_BUILD_CACHE: ${{ github.ref == 'refs/heads/main' && inputs.save-cache == 'true' && 'gha-save' || 'gha' }}
    - if: inputs.save-cache == 'true'
      uses: ./.github/actions/go-cache-save
      with:
        name: e2e
